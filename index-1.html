function words(line){return String(line).split(/\s+/).map(t=>t.replace(/^[^A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]+|[^A-Za-zÀ-ÖØ-öø-ÿŒœÆæ'’-]+$/g,'')).filter(t=>(t.match(/[A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]/g)||[]).length>=2)}function lookup(p,l,w){let ls=BOOK[String(p)];if(!ls||l<1||l>ls.length)return null;let ws=words(ls[l-1]);return w>=1&&w<=ws.length?ws[w-1].replace(/[’']/g,"’"):null}
function fit(){let max=innerWidth-16,s=Math.min(innerWidth*.28,innerHeight*.28);wordEl.style.fontSize=s+'px';while(wordEl.scrollWidth>max&&s>18){s*=.92;wordEl.style.fontSize=s+'px'}}function reveal(x){wordEl.textContent=x;fit();wordEl.classList.add('show');armed=false}function clear(){wordEl.classList.remove('show');wordEl.textContent=''}function start(){if(!recognition||busy)return;clear();armed=true;try{recognition.start()}catch(e){}}
function init(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){debugEl.textContent='Reconnaissance vocale indisponible';return false}recognition=new SR();recognition.lang='fr-FR';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=3;recognition.onstart=()=>busy=true;recognition.onend=()=>{busy=false;if(armed&&!wordEl.classList.contains('show'))setTimeout(start,180)};recognition.onerror=e=>{busy=false;debugEl.textContent=e.error};recognition.onresult=e=>{armed=false;for(let i=0;i<e.results[0].length;i++){let t=e.results[0][i].transcript,q=triple(t);if(q){let ans=lookup(...q);if(ans){reveal(ans);if(navigator.vibrate)navigator.vibrate(25);return}}}setTimeout(start,250)};return true}
