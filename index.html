  }
  return used ? total+current : null;
}
function numericTokenValue(tok){
  if(/^\d+$/.test(tok)) return Number(tok);
  if(/^\d+(?:-\d+)+$/.test(tok)){
    const parts=tok.split('-').map(Number);
    if(parts.every(n=>n>=0 && n<=9)) return Number(parts.join(''));
    if(parts.length===2 && parts[0]%10===0 && parts[0]>=10 && parts[0]<=90 && parts[1]>=0 && parts[1]<=9) return parts[0]+parts[1];
  }
  return null;
}
function lastNumberCandidate(section, max){
  section=norm(section).replace(/[,;:!?]/g,' ');
  const toks=section.split(/\s+/).filter(Boolean);
  let cands=[];
  // Arabic forms, including trailing sequences of single digits.
  for(let i=0;i<toks.length;i++){
    const v=numericTokenValue(toks[i]);
    if(v!==null && v>=0 && v<=max) cands.push({pos:i+.01,len:1,pri:2,val:v});
    if(/^\d$/.test(toks[i])){
      let j=i, digs=[];
      while(j<toks.length && /^\d$/.test(toks[j])){digs.push(toks[j]);j++;}
      if(digs.length>=2){const n=Number(digs.join('')); if(n<=max)cands.push({pos:j-.001,len:digs.length,pri:4,val:n}); i=j-1;}
    }
  }
  // Explicit spoken digit sequences: "un neuf six" => 196.
  // Give these extra priority so a redundant digit-by-digit correction wins over a preceding natural number.
  for(let i=0;i<toks.length;i++){
    if(Object.prototype.hasOwnProperty.call(SMALL,toks[i]) && SMALL[toks[i]]>=0 && SMALL[toks[i]]<=9){
      let j=i,digs=[];
      while(j<toks.length && Object.prototype.hasOwnProperty.call(SMALL,toks[j]) && SMALL[toks[j]]>=0 && SMALL[toks[j]]<=9){ digs.push(String(SMALL[toks[j]])); j++; }
      if(digs.length>=2){ const n=Number(digs.join('')); if(n<=max)cands.push({pos:j+.01,len:digs.length,pri:5,val:n}); i=j-1; }
    }
  }
  // Ordinals anywhere in the section.
  for(let i=0;i<toks.length;i++){
    if(Object.prototype.hasOwnProperty.call(ORD,toks[i])) cands.push({pos:i+.02,len:1,pri:1,val:ORD[toks[i]]});
  }
  // French chunks: inspect suffixes so the LAST clear form can correct an earlier one.
  for(let start=0;start<toks.length;start++){
    for(let end=start+1;end<=Math.min(toks.length,start+6);end++){
      const chunk=toks.slice(start,end).join(' ');
      const v=parseFrenchCardinal(chunk);
      if(v!==null && v>=0 && v<=max) cands.push({pos:end+.001,len:end-start,pri:3,val:v});
    }
  }
  if(!cands.length) return null;
  cands.sort((a,b)=>(a.pos-b.pos)||((a.len||0)-(b.len||0))||((a.pri||0)-(b.pri||0))); 
  return cands[cands.length-1].val;
}

function extractSections(text){
  // Keep only the portions following trigger words until the next trigger.
  const low=norm(text);
  const re=/\b(page|ligne|mot)\b/g;
  let hits=[],m;
  while((m=re.exec(low))) hits.push({kind:m[1],start:m.index,end:re.lastIndex});
  return hits.map((h,i)=>{
    let end = i+1<hits.length ? hits[i+1].start : low.length;
    // If the next trigger is preceded by an ordinal ("septieme ligne", "cinquieme mot"),
    // that ordinal belongs to the NEXT command, not to the current section.
    if(i+1<hits.length){
      const pre=low.slice(h.end,end);
      const mm=pre.match(/\b([a-z-]+)\s*$/);
      if(mm && Object.prototype.hasOwnProperty.call(ORD,mm[1])) end -= mm[0].length;
    }
    return {kind:h.kind,body:low.slice(h.end,end)};
  });
}
function ordinalBeforeTrigger(text,kind,max){
  const low=norm(text);
  const re=new RegExp('\\b([a-z-]+)\\s+'+kind+'\\b','g');
  let m,last=null;
  while((m=re.exec(low))){
    const key=m[1];
    if(Object.prototype.hasOwnProperty.call(ORD,key) && ORD[key]<=max) last=ORD[key];
  }
  return last;
}

function lineExists(p,l){ const a=BOOK[String(p)]; return !!a && l>=1 && l<=a.length; }
function wordExists(p,l,w){ const a=BOOK[String(p)]; return lineExists(p,l) && w>=1 && w<=a[l-1].length; }
function resolveAndShow(){
  if(state.page && state.line && state.word && wordExists(state.page,state.line,state.word)){
    showWord(BOOK[String(state.page)][state.line-1][state.word-1]);
  }
}

function handleTranscript(raw){
  let text=norm(raw);
  if(!text) return;
  const resetPhrase='nouvelle experience';
  const rp=text.lastIndexOf(resetPhrase);
  if(rp>=0){
    fullReset();
    text=text.slice(rp+resetPhrase.length).trim();
    if(!text) return;
  }

  const sections=extractSections(text);
  // Process in spoken order. Any valid new page resets line+word immediately.
  for(const s of sections){
    if(s.kind==='page'){
      const p=lastNumberCandidate(s.body,305);
      if(p && BOOK[String(p)]) startNewPage(p);
    } else if(s.kind==='ligne' && state.page){
      let l=lastNumberCandidate(s.body,60);
      if(!l) l=ordinalBeforeTrigger(text,'ligne',60);
      if(l){ state.word=null; hideWord(); if(lineExists(state.page,l)) state.line=l; else state.line=null; }
    } else if(s.kind==='mot' && state.page && state.line){
      let w=lastNumberCandidate(s.body,50);
      if(!w) w=ordinalBeforeTrigger(text,'mot',50);
      if(w){ state.word=null; hideWord(); if(wordExists(state.page,state.line,w)){ state.word=w; resolveAndShow(); } }
    }
  }
  // Also catch "septième ligne" / "cinquième mot" when the ordinal precedes the trigger.
  if(state.page){
    const l=ordinalBeforeTrigger(text,'ligne',60);
    if(l && lineExists(state.page,l)) { if(state.line!==l){state.line=l;state.word=null;hideWord();} }
  }
  if(state.page && state.line){
    const w=ordinalBeforeTrigger(text,'mot',50);
    if(w && wordExists(state.page,state.line,w)){ state.word=w; resolveAndShow(); }
  }
}

function makeRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  const r=new SR();
  r.lang='fr-FR';
  r.continuous=true;
  r.interimResults=false;
  r.maxAlternatives=3;
  r.onstart=()=>{listening=true;starting=false;};
  r.onerror=(e)=>{listening=false;starting=false; if(activated && e.error!=='not-allowed' && e.error!=='service-not-allowed') setTimeout(startRecognition,350);};
  r.onend=()=>{listening=false;starting=false; if(activated) setTimeout(startRecognition,180);};
  r.onresult=(ev)=>{
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(!ev.results[i].isFinal) continue;
      // Try alternatives in order; the first one yielding a meaningful command wins naturally.
      for(let a=0;a<ev.results[i].length;a++){
        const t=ev.results[i][a].transcript;
        const before=JSON.stringify(state)+wordEl.textContent;
        handleTranscript(t);
        const after=JSON.stringify(state)+wordEl.textContent;
        if(after!==before) break;
      }
    }
  };
  return r;
}
function startRecognition(){
  if(!activated || listening || starting) return;
  if(!recognition) recognition=makeRecognition();
  if(!recognition) return;
  try{starting=true;recognition.start();}catch(e){starting=false;setTimeout(startRecognition,400);}
}
async function enterImmersiveFullscreen(){
  const el=document.documentElement;
  try{
    if(document.fullscreenElement) return true;
    if(el.requestFullscreen){
      try{ await el.requestFullscreen({navigationUI:'hide'}); }
      catch(_){ await el.requestFullscreen(); }
      return !!document.fullscreenElement;
    }
    if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); return true; }
  }catch(_){ }
  return false;
}
async function activate(){
  if(activated) return;
  // Start microphone immediately from the user gesture; fullscreen is best-effort only.
  // Awaiting fullscreen first can break SpeechRecognition activation on some Android/Chrome builds.
  activated=true;
  enterImmersiveFullscreen();
  document.documentElement.style.background='#000';
  document.body.style.background='#000';
  try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
  startRecognition();
}
// One initial touch starts full-screen + microphone; after that everything is voice controlled.
document.addEventListener('pointerdown',activate,{once:true,capture:true});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script>
